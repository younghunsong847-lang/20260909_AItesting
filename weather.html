<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 앱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* 날씨별 배경 */
        body.sunny {
            background: linear-gradient(135deg, #FFD89B 0%, #19547B 100%);
        }

        body.rainy {
            background: linear-gradient(135deg, #4A5568 0%, #2D3748 100%);
        }

        body.cloudy {
            background: linear-gradient(135deg, #B8B8D1 0%, #7C7C8E 100%);
        }

        body.clear-night {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
        }

        body.snowy {
            background: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
        }

        /* 날씨 이펙트 배경 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        body.rainy::before {
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 60px 70px, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 50px 50px, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 90px 10px, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
            background-repeat: repeat;
            background-size: 160px 100px;
            background-position: 0 0;
            animation: rain 0.5s linear infinite;
        }

        body.snowy::before {
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 60px 70px, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0)),
                radial-gradient(1.5px 1.5px at 50px 50px, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 90px 10px, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            background-position: 0 0;
            animation: snow 3s linear infinite;
        }

        body.windy::before {
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 35px,
                rgba(255, 255, 255, 0.1) 35px,
                rgba(255, 255, 255, 0.1) 70px
            );
            animation: wind 0.8s linear infinite;
        }

        @keyframes rain {
            to {
                background-position: 0 100px;
            }
        }

        @keyframes snow {
            to {
                background-position: 0 -200px;
            }
        }

        @keyframes wind {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .search-button {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .search-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: none;
            animation: slideUp 0.5s ease;
        }

        .weather-card.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-name {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 80px;
            margin: 20px 0;
        }

        .temperature {
            font-size: 72px;
            font-weight: 300;
            margin: 20px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .temperature-unit {
            font-size: 36px;
            vertical-align: top;
        }

        .weather-description {
            font-size: 24px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .detail-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .detail-label {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.3);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            display: none;
            margin-top: 20px;
        }

        .error-message.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            font-size: 18px;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="cityInput" 
                placeholder="도시명을 입력하세요 (예: 서울)"
                onkeypress="handleKeyPress(event)"
            >
            <button class="search-button" onclick="searchWeather()">검색</button>
        </div>

        <div class="loading" id="loading"></div>
        <div class="error-message" id="errorMessage"></div>

        <div class="weather-card" id="weatherCard">
            <div class="city-name" id="cityName"></div>
            <div class="weather-icon" id="weatherIcon"></div>
            <div class="temperature">
                <span id="temperature"></span><span class="temperature-unit">°C</span>
            </div>
            <div class="weather-description" id="weatherDescription"></div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">최고기온</div>
                    <div class="detail-value" id="maxTemp">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">최저기온</div>
                    <div class="detail-value" id="minTemp">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">체감 기온</div>
                    <div class="detail-value" id="feelsLike">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">습도</div>
                    <div class="detail-value" id="humidity">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">풍속</div>
                    <div class="detail-value" id="windSpeed">-</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">기압</div>
                    <div class="detail-value" id="pressure">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const weatherCode = {
            0: { icon: '☀️', description: '맑음' },
            1: { icon: '🌤️', description: '거의 맑음' },
            2: { icon: '⛅', description: '부분적으로 흐림' },
            3: { icon: '☁️', description: '흐림' },
            45: { icon: '🌫️', description: '안개' },
            48: { icon: '🌫️', description: '서리' },
            51: { icon: '🌧️', description: '이슬비' },
            53: { icon: '🌧️', description: '이슬비' },
            55: { icon: '🌧️', description: '이슬비' },
            61: { icon: '🌧️', description: '약한 비' },
            63: { icon: '🌧️', description: '비' },
            65: { icon: '⛈️', description: '강한 비' },
            71: { icon: '❄️', description: '약한 눈' },
            73: { icon: '❄️', description: '눈' },
            75: { icon: '❄️', description: '강한 눈' },
            77: { icon: '❄️', description: '눈' },
            80: { icon: '🌧️', description: '약한 소나기' },
            81: { icon: '🌧️', description: '소나기' },
            82: { icon: '⛈️', description: '강한 소나기' },
            85: { icon: '❄️', description: '눈 소나기' },
            86: { icon: '❄️', description: '강한 눈 소나기' },
            95: { icon: '⛈️', description: '뇌우' },
            96: { icon: '⛈️', description: '우박을 동반한 뇌우' },
            99: { icon: '⛈️', description: '우박을 동반한 뇌우' }
        };

        function getWeatherTheme(code, windSpeed) {
            if ([0, 1].includes(code)) return 'sunny';
            if ([61, 63, 65, 80, 81, 82, 95, 96, 99].includes(code)) return 'rainy';
            if ([71, 73, 75, 77, 85, 86].includes(code)) return 'snowy';
            if (windSpeed > 10) return 'windy';
            if ([2, 3].includes(code)) return 'cloudy';
            return 'clear-night';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('도시명을 입력해주세요');
                return;
            }

            showLoading(true);
            hideError();

            try {
                // Step 1: 도시명으로 좌표 조회
                const geoResponse = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ko`
                );
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    showError('도시를 찾을 수 없습니다');
                    showLoading(false);
                    return;
                }

                const location = geoData.results[0];
                const { latitude, longitude, name, country } = location;

                // Step 2: 좌표로 날씨 조회
                const weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
                );
                const weatherData = await weatherResponse.json();

                const current = weatherData.current;
                const daily = weatherData.daily;
                const weatherInfo = weatherCode[current.weather_code] || { icon: '❓', description: '불명' };
                const theme = getWeatherTheme(current.weather_code, current.wind_speed_10m);

                // 화면 업데이트
                displayWeather({
                    city: `${name}, ${country}`,
                    temperature: Math.round(current.temperature_2m),
                    description: weatherInfo.description,
                    icon: weatherInfo.icon,
                    feelsLike: Math.round(current.apparent_temperature),
                    humidity: current.relative_humidity_2m,
                    windSpeed: current.wind_speed_10m.toFixed(1),
                    pressure: current.pressure_msl,
                    maxTemp: Math.round(daily.temperature_2m_max[0]),
                    minTemp: Math.round(daily.temperature_2m_min[0]),
                    theme: theme
                });

                showLoading(false);
            } catch (error) {
                console.error('Error:', error);
                showError('날씨 정보를 가져올 수 없습니다. 다시 시도해주세요.');
                showLoading(false);
            }
        }

        function displayWeather(data) {
            // 배경색 변경
            document.body.className = data.theme;

            // 데이터 표시
            document.getElementById('cityName').textContent = data.city;
            document.getElementById('weatherIcon').textContent = data.icon;
            document.getElementById('temperature').textContent = data.temperature;
            document.getElementById('weatherDescription').textContent = data.description;
            document.getElementById('maxTemp').textContent = `${data.maxTemp}°C`;
            document.getElementById('minTemp').textContent = `${data.minTemp}°C`;
            document.getElementById('feelsLike').textContent = `${data.feelsLike}°C`;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.windSpeed} m/s`;
            document.getElementById('pressure').textContent = `${data.pressure} hPa`;

            // 카드 표시
            document.getElementById('weatherCard').classList.add('show');
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        function showLoading(show) {
            const loadingEl = document.getElementById('loading');
            if (show) {
                loadingEl.classList.add('show');
            } else {
                loadingEl.classList.remove('show');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        // 초기 로드
        document.getElementById('cityInput').focus();
    </script>
</body>
</html>
