<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연차 일수 계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #999;
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 15px;
        }

        input[type="date"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: #f0f4ff;
        }

        .info-section {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .info-section h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-section p {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .info-section p:last-child {
            margin-bottom: 0;
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
            margin-bottom: 20px;
        }

        .result-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-number {
            font-size: 80px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .result-unit {
            font-size: 20px;
            opacity: 0.9;
        }

        .details-card {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        .detail-value {
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
            margin-top: 20px;
        }

        .warning strong {
            display: block;
            margin-bottom: 5px;
        }

        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #721c24;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 연차 계산기</h1>
        <p class="subtitle">한국 근로기준법 기준</p>

        <div class="form-group">
            <label for="joinDate">입사일을 선택하세요</label>
            <input 
                type="date" 
                id="joinDate"
                onchange="calculateOffDays()"
            >
        </div>

        <div class="info-section">
            <h3>📋 계산 기준</h3>
            <p>✓ 1년 미만: 매월 1일씩 (총 12일)</p>
            <p>✓ 1년 이상: 15일 + (근무 년수 - 1)일</p>
            <p>✓ 예) 1년차: 15일, 2년차: 16일, 3년차: 17일</p>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="result-section" id="resultSection">
            <div class="result-card">
                <div class="result-label">올해 발생하는 연차 일수</div>
                <div class="result-number" id="resultNumber">0</div>
                <div class="result-unit">일</div>
            </div>

            <div class="details-card">
                <div class="detail-item">
                    <span class="detail-label">입사일</span>
                    <span class="detail-value" id="joinDateDisplay">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">근무 기간</span>
                    <span class="detail-value" id="workPeriod">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">올해 근무 개월</span>
                    <span class="detail-value" id="workMonth">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">계산 방식</span>
                    <span class="detail-value" id="calcMethod">-</span>
                </div>
            </div>

            <div class="warning">
                <strong>⚠️ 주의사항</strong>
                이 계산은 기본적인 근로기준법을 기준으로 한 것입니다.<br>
                회사의 정책이나 특수한 상황에 따라 달라질 수 있습니다.
            </div>
        </div>
    </div>

    <script>
        const joinDateInput = document.getElementById('joinDate');
        const resultSection = document.getElementById('resultSection');
        const errorMessage = document.getElementById('errorMessage');

        // 오늘 날짜를 기본값으로 설정
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        joinDateInput.max = `${year}-${month}-${day}`;

        function calculateOffDays() {
            const joinDateStr = joinDateInput.value;

            if (!joinDateStr) {
                resultSection.classList.remove('show');
                errorMessage.classList.remove('show');
                return;
            }

            const joinDate = new Date(joinDateStr);
            const today = new Date();

            // 입사일이 미래인지 확인
            if (joinDate > today) {
                showError('입사일은 오늘 이전이어야 합니다.');
                resultSection.classList.remove('show');
                return;
            }

            errorMessage.classList.remove('show');

            // 정확한 근무 년수 계산
            let years = today.getFullYear() - joinDate.getFullYear();
            let months = today.getMonth() - joinDate.getMonth();
            
            if (months < 0) {
                years--;
                months += 12;
            }

            // 날짜 보정
            if (today.getDate() < joinDate.getDate()) {
                months--;
                if (months < 0) {
                    years--;
                    months += 12;
                }
            }

            const totalMonths = years * 12 + months;
            
            let offDays = 0;
            let calcMethodText = '';

            if (years === 0) {
                // 1년 미만: 매월 1일씩
                offDays = Math.min(months + 1, 12);
                calcMethodText = `1년 미만 (근무 ${months + 1}개월, 월 1일)`;
            } else {
                // 1년 이상: 15 + (근무 년수 - 1)
                offDays = 15 + (years - 1);
                calcMethodText = `${years}년차 (15일 + ${years - 1}일)`;
            }

            // 결과 표시
            displayResult(joinDate, offDays, years, months, calcMethodText);
        }

        function displayResult(joinDate, offDays, years, months, calcMethod) {
            document.getElementById('resultNumber').textContent = offDays;
            document.getElementById('joinDateDisplay').textContent = formatDate(joinDate);
            
            // 근무 기간 표시
            let periodText = '';
            if (years > 0) {
                periodText += `${years}년`;
            }
            if (months > 0) {
                periodText += ` ${months}개월`;
            }
            document.getElementById('workPeriod').textContent = periodText || '1개월 미만';
            
            // 올해 근무 개월 수
            const yearStart = new Date(new Date().getFullYear(), 0, 1);
            let monthsThisYear = new Date().getMonth() - yearStart.getMonth();
            
            if (new Date().getDate() < joinDate.getDate() && joinDate.getMonth() === new Date().getMonth()) {
                monthsThisYear--;
            }
            
            if (joinDate.getFullYear() === new Date().getFullYear()) {
                monthsThisYear = new Date().getMonth() - joinDate.getMonth();
                if (new Date().getDate() < joinDate.getDate()) {
                    monthsThisYear--;
                }
            }
            
            document.getElementById('workMonth').textContent = `${Math.max(1, monthsThisYear + 1)}개월`;
            document.getElementById('calcMethod').textContent = calcMethod;

            resultSection.classList.add('show');
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}년 ${month}월 ${day}일`;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
